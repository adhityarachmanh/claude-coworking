appId: com.adhit.adhitron
productName: Adhitron Desktop
copyright: Adhit
# Reuse the Electron runtime installed by npm ci instead of downloading the ZIP from GitHub again (flaky 504s).
electronDist: node_modules/electron/dist
directories:
  output: dist/electron
  buildResources: assets
files:
  - desktop/**
  - package.json
extraResources:
  - from: assets/icon.ico
    to: icon.ico
  - from: assets/icon.png
    to: icon.png
asar: true
win:
  target:
    - dir
  icon: assets/icon.ico
  executableName: AdhitronDesktop
mac:
  target:
    - dir
  icon: assets/icon.png
  category: public.app-category.developer-tools
linux:
  target:
    - dir
  icon: assets/icon.png
  category: Development
