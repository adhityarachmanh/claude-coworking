name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test test/engine-mix-ui.test.mjs
      - run: node --test test/concurrency-retention-ui.test.mjs
      - run: node --test test/mobile-chat.test.mjs
