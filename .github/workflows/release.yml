name: release

# Stable release pipeline: tag v* builds Windows/Linux, signs every asset with the Ed25519 key in the
# UPDATE_SIGNING_KEY secret, and uploads installer + checksums + signatures to the GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # GitHub's Electron release download often returns 504 on runners; the mirror keeps npm ci deterministic.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Ensure Electron runtime
        run: node node_modules/electron/install.js
      - name: Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows (server + Electron + installer)
        run: npm run build:win
      - name: Smoke test server
        shell: pwsh
        run: |
          $env:OFFICE_PORT = '4399'
          $env:OFFICE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'office-smoke'
          $p = Start-Process -FilePath 'dist\AdhitOffice\AdhitOffice.exe' -ArgumentList '--background' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:4399/health' -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'Smoke test gagal: /health bukan 200' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Sign assets
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'update-key.pem'
          $env:UPDATE_SIGNING_KEY | Set-Content -NoNewline -Encoding ascii $key
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/sign-release.mjs "dist/installer/AdhitOffice-Setup-$version.exe" $key
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Adhit Office $($tag.TrimStart('v'))" --notes "Rilis $tag" 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host 'Release sudah dibuat oleh job lain.' } }
          gh release upload $tag dist/installer/*.exe dist/installer/*.sha256 dist/installer/*.sig --clobber

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Build Linux (tar.gz + deb)
        run: npm run build:linux
      - name: Sign assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          printf '%s' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          for f in dist/linux/*.tar.gz dist/linux/*.deb; do node scripts/sign-release.mjs "$f" "$RUNNER_TEMP/update-key.pem"; done
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Adhit Office ${TAG#v}" --notes "Rilis $TAG" || true
          gh release upload "$TAG" dist/linux/*.tar.gz dist/linux/*.deb dist/linux/*.sha256 dist/linux/*.sig --clobber
