name: release

# Stable release pipeline: tag v* builds Windows/Linux, signs every asset with the Ed25519 key in the
# UPDATE_SIGNING_KEY secret, and uploads installer + checksums + signatures to the GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # GitHub's Electron release download often returns 504 on runners; the mirror keeps npm ci deterministic.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Ensure Electron runtime
        run: node node_modules/electron/install.js
      - name: Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows (server + Electron + installer)
        run: npm run build:win
      - name: Smoke test server
        shell: pwsh
        run: |
          $env:OFFICE_PORT = '4399'
          $env:OFFICE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'office-smoke'
          $p = Start-Process -FilePath 'dist\AdhitOffice\AdhitOffice.exe' -ArgumentList '--background' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:4399/health' -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'Smoke test gagal: /health bukan 200' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Sign assets
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'update-key.pem'
          $env:UPDATE_SIGNING_KEY | Set-Content -NoNewline -Encoding ascii $key
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/sign-release.mjs "dist/installer/AdhitOffice-Setup-$version.exe" $key
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          node scripts/release-notes.mjs "$version" --out "$notes"
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --draft --title "Adhit Office $version" --notes-file "$notes" 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host 'Release sudah dibuat oleh job lain.' } }
          gh release edit $tag --notes-file "$notes"; if ($LASTEXITCODE -ne 0) { Write-Host 'Catatan rilis tidak diperbarui; aset tetap diunggah.' }
          gh release upload $tag dist/installer/*.exe dist/installer/*.sha256 dist/installer/*.sig --clobber

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Build Linux (tar.gz + deb)
        run: npm run build:linux
      - name: Sign assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          printf '%s' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          for f in dist/linux/*.tar.gz dist/linux/*.deb; do node scripts/sign-release.mjs "$f" "$RUNNER_TEMP/update-key.pem"; done
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs "$VERSION" --out "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Adhit Office $VERSION" --notes-file "$RUNNER_TEMP/notes.md" || true
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" || true
          gh release upload "$TAG" dist/linux/*.tar.gz dist/linux/*.deb dist/linux/*.sha256 dist/linux/*.sig --clobber

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Build .app
        run: npm run build:mac
      - name: Checksum
        run: |
          cd dist/macos
          for f in *.zip; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -lh
      - name: Sign assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          printf '%s' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          for f in dist/macos/*.zip; do node scripts/sign-release.mjs "$f" "$RUNNER_TEMP/update-key.pem"; done
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs "$VERSION" --out "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Adhit Office $VERSION" --notes-file "$RUNNER_TEMP/notes.md" || true
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" || true
          gh release upload "$TAG" dist/macos/*.zip dist/macos/*.sha256 dist/macos/*.sig --clobber

  # The release stays a draft until every platform has uploaded: nobody downloads a half-finished release.
  publish:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gh needs a checkout to know which repository the tag belongs to.
      - uses: actions/checkout@v4
      - name: Check every platform is there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>&1) || {
            echo "::error file=.github/workflows/release.yml::tidak bisa membaca rilis draft: $ASSETS"
            exit 1
          }
          missing=0
          check() {
            echo "$ASSETS" | grep -qE "$1" || { echo "::error file=.github/workflows/release.yml::aset rilis hilang: $1"; missing=1; }
          }
          check '^AdhitOffice-Setup-[0-9.]+\.exe$'
          check '^AdhitOffice-Setup-[0-9.]+\.exe\.sha256$'
          check '^AdhitOffice-Setup-[0-9.]+\.exe\.sig$'
          check '^AdhitOffice-[0-9.]+-linux-x64\.tar\.gz$'
          check '^AdhitOffice-[0-9.]+-linux-x64\.tar\.gz\.sha256$'
          check '^AdhitOffice-[0-9.]+-linux-x64\.tar\.gz\.sig$'
          check '^adhit-office_[0-9.]+_amd64\.deb$'
          check '^adhit-office_[0-9.]+_amd64\.deb\.sha256$'
          check '^adhit-office_[0-9.]+_amd64\.deb\.sig$'
          check '^AdhitOffice-[0-9.]+-macos-arm64-unsigned\.zip$'
          check '^AdhitOffice-[0-9.]+-macos-arm64-unsigned\.zip\.sha256$'
          check '^AdhitOffice-[0-9.]+-macos-arm64-unsigned\.zip\.sig$'
          check '^AdhitOffice-[0-9.]+-macos-x64-unsigned\.zip$'
          check '^AdhitOffice-[0-9.]+-macos-x64-unsigned\.zip\.sha256$'
          check '^AdhitOffice-[0-9.]+-macos-x64-unsigned\.zip\.sig$'
          exit $missing
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
