name: cleanup-1.0.6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the abandoned 1.0.6 draft and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.0.6 --yes --cleanup-tag -R "$GITHUB_REPOSITORY"
