name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency project: `npm run lint` fetches a pinned ESLint via npx (no lockfile).
      - name: Syntax check (node --check)
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - name: ESLint
        run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Offline suite: uses a fake Claude Code, so no account or tokens are needed.
      - run: npm test
