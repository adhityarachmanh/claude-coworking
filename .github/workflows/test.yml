name: test

# On every push/PR: syntax, ESLint, the pure-logic suite (~40 s), and a small release-critical integration smoke
# (real server, queue/concurrency, backup, CLI bridge). The full server/UI suites stay nightly/weekly so this job
# stays fast enough to gate every push.
on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (node --check)
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - name: ESLint
        run: npm run lint
      - name: Fast tests
        run: npm run test:fast
      - name: Locate failing fast test
        if: failure()
        run: node test-support/ci-fast-files.mjs

  # The release-critical integration half (~1–2 min): real server, approvals, queue/concurrency, backup, CLI bridge.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integration smoke
        run: npm run test:smoke
