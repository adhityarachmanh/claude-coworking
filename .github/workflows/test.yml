name: test

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency project: `npm run lint` fetches a pinned ESLint via npx (no lockfile).
      - name: Syntax check (node --check)
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - name: ESLint
        run: npm run lint

  # Unit + server integration tests: fake Claude Code / OpenCode / gh, no account or tokens, no browser.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test-support/ci-tests.mjs unit

  # Browser tests (headless Chrome over CDP, preinstalled on the runner). A file that fails is retried once and
  # reported as flaky in the job summary when it passes then.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test-support/ci-tests.mjs ui
