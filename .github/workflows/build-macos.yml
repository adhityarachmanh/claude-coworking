name: build-macos

# Build the unsigned macOS .app on GitHub's macOS runners (no Mac needed). Tag pushes attach the ZIP to the
# GitHub Release; manual runs keep it as a workflow artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build .app
        run: npm run build:mac
      - name: Checksum
        run: |
          cd dist/macos
          for f in *.zip; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -lh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdhitOffice-macos-${{ matrix.arch }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Adhit Office ${TAG#v}" --notes "Rilis ${TAG}"
          gh release upload "$TAG" dist/macos/*.zip dist/macos/*.sha256 --clobber
