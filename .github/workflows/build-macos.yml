name: build-macos

# Manual macOS build on GitHub's runners (no Mac needed): keeps the ZIP as a workflow artifact for testing.
# Tag releases build macOS inside release.yml, so the draft is published only after every platform is ready.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Build .app
        run: npm run build:mac
      - name: Checksum
        run: |
          cd dist/macos
          for f in *.zip; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -lh
      - name: Sign assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          printf '%s' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          for f in dist/macos/*.zip; do node scripts/sign-release.mjs "$f" "$RUNNER_TEMP/update-key.pem"; done
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdhitOffice-macos-${{ matrix.arch }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
            dist/macos/*.sig
          if-no-files-found: error
