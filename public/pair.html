<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121317" />
    <title>Hubungkan perangkat — Adhit Office</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root { --bg: #121317; --surface: #1f232b; --border: #2c303b; --text: #ece9e4; --muted: #8d939f; --accent: #d97757; --err: #f0524a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
      main { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 20px; text-align: center; }
      .logo { width: 48px; height: 48px; image-rendering: pixelated; }
      h1 { font-size: 19px; margin: 6px 0 4px; }
      p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
      input { width: 100%; font: 600 30px/1 ui-monospace, Consolas, monospace; letter-spacing: 10px; text-align: center; padding: 12px 8px 12px 18px; border-radius: 12px; border: 1px solid var(--border); background: #15171c; color: var(--text); outline: none; }
      input:focus { border-color: var(--accent); }
      button { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 12px; background: #b85a3c; color: #fff; font-weight: 600; font-size: 16px; line-height: 1; font-family: inherit; cursor: pointer; }
      button:disabled { opacity: .5; }
      .msg { min-height: 22px; margin-top: 12px; font-size: 14px; color: var(--err); }
      small { display: block; margin-top: 16px; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icons/icon.svg" alt="" />
      <h1>Hubungkan ke Adhit Office</h1>
      <p>Masukkan kode 6 digit yang tampil di laptop:<br />📱 Buka di HP (kanan atas)</p>
      <form id="form">
        <input id="code" aria-label="Kode 6 digit dari laptop" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required autofocus />
        <button id="btn">Hubungkan</button>
      </form>
      <div id="msg" class="msg" role="alert">__MESSAGE__</div>
      <small>Atau scan QR di laptop. Perangkat ini akan diingat sampai dicabut dari laptop.</small>
    </main>
    <script>
      const form = document.getElementById('form');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        msg.textContent = '';
        try {
          const res = await fetch('/pair', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: document.getElementById('code').value }),
          });
          const data = await res.json();
          if (res.ok) return location.replace('/');
          msg.textContent = data.error + (data.triesLeft ? ` Sisa ${data.triesLeft} percobaan.` : '');
        } catch {
          msg.textContent = 'Tidak bisa menghubungi laptop. Pastikan di WiFi yang sama.';
        }
        btn.disabled = false;
      });
    </script>
  </body>
</html>
